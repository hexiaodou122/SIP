<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Sip Cup</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: transparent;
      user-select: none; -webkit-user-select: none; cursor: default;
    }
    #hanger {
      position: absolute; top: 10px; right: 30px; width: 48px; height: 64px;
      will-change: transform;
    }
    #glass { display: block; overflow: visible; transform-origin: 25% 89%; will-change: transform; }
    #hit { position: absolute; inset: -10px -14px -8px -18px; }

    body.preview {
      background: linear-gradient(160deg, #e8dccd, #a9b9c4 60%, #6d7f8d);
      font: 12px -apple-system, "PingFang SC", sans-serif;
    }
    body.preview .help { position: fixed; left: 8px; bottom: 6px; color: rgba(0,0,0,.5); }
  </style>
</head>
<body>
  <div id="hanger">
    <svg id="glass" width="48" height="64" viewBox="-4 -4 48 64" aria-hidden="true">
      <defs>
        <clipPath id="inside">
          <path d="M6.2 5.2 L33.8 5.2 L31 49.4 Q30.8 51.6 28.6 51.6 L11.4 51.6 Q9.2 51.6 9 49.4 Z"/>
        </clipPath>
        <linearGradient id="glassFill" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="rgba(255,255,255,0.30)"/>
          <stop offset="0.35" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="0.8" stop-color="rgba(255,255,255,0.05)"/>
          <stop offset="1" stop-color="rgba(255,255,255,0.22)"/>
        </linearGradient>
        <linearGradient id="waterFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="rgba(196,228,240,0.62)"/>
          <stop offset="1" stop-color="rgba(124,176,200,0.62)"/>
        </linearGradient>
      </defs>

      <!-- 杯身 -->
      <path d="M4.6 3.6 L35.4 3.6 L32.4 50 Q32 53.4 28.6 53.4 L11.4 53.4 Q8 53.4 7.6 50 Z"
            fill="url(#glassFill)"/>

      <!-- 杯里的水：水面始终保持水平 -->
      <g clip-path="url(#inside)">
        <g id="water">
          <rect x="-30" y="0" width="100" height="80" fill="url(#waterFill)"/>
          <rect x="-30" y="0" width="100" height="1" fill="rgba(255,255,255,0.85)"/>
        </g>
      </g>

      <!-- 杯底厚玻璃 -->
      <path d="M9.4 48.6 L30.6 48.6 L30.4 50.4 Q30.1 51.9 28.4 51.9 L11.6 51.9 Q9.9 51.9 9.6 50.4 Z"
            fill="rgba(255,255,255,0.28)"/>

      <!-- 轮廓：深色一圈 + 白色一圈，在亮背景和暗背景上都看得见 -->
      <path d="M4.6 3.6 L7.6 50 Q8 53.4 11.4 53.4 L28.6 53.4 Q32 53.4 32.4 50 L35.4 3.6"
            fill="none" stroke="rgba(30,52,64,0.42)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M4.6 3.6 L7.6 50 Q8 53.4 11.4 53.4 L28.6 53.4 Q32 53.4 32.4 50 L35.4 3.6"
            fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
      <ellipse cx="20" cy="3.6" rx="15.4" ry="1.5" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="0.7"/>
      <ellipse cx="20" cy="3.6" rx="15.4" ry="1.5" fill="none" stroke="rgba(30,52,64,0.22)" stroke-width="0.5" transform="translate(0 0.9)"/>

      <!-- 高光 -->
      <path d="M9.6 9 L11.6 44" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M13.2 10 L13.9 22" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M31.2 12 L29.8 40" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-linecap="round"/>

      <!-- 出水口（左上杯沿），只用来定位 -->
      <circle id="spout" cx="4.8" cy="3.8" r="0.1" fill="none"/>
    </svg>
    <div id="hit"></div>
  </div>
  <script src="cup.js"></script>
</body>
</html>
